<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crimson Commander — isolated identity QA</title><link rel="stylesheet" href="/elite-armory.css"><style>body{margin:24px auto;padding:0 16px;max-width:880px;background:#0b1525;color:#e5f5ff;font:16px/1.5 system-ui}button{min-height:44px;margin:6px;padding:12px;font:inherit}canvas{max-width:100%;height:auto}#portrait{width:180px}.controls{display:flex;flex-wrap:wrap}#result{margin:16px 0}</style><h1>Crimson Commander identity lab</h1><p>Isolated simulated results. No purchases, Telegram calls, saved equipment, mission progress or rewards. Uses the production artwork and celebration component.</p><canvas id="portrait" width="256" height="256" aria-label="Production Crimson Commander portrait"></canvas><canvas id="banner" class="eliteCommanderBanner" width="1200" height="220" aria-label="Production Crimson Commander profile banner"></canvas><div class="controls"><button onclick="show(false)">Show Solo test completion</button><button onclick="show(true)">Show Co-op test completion</button><button onclick="refresh()">Refresh same result</button><button onclick="failed()">Show failed result</button></div><label><input type="checkbox" id="reduced"> Static salute for reduced motion</label><div id="result"></div><p>Existing mission controls remain outside the optional celebration.</p><button id="continue" onclick="this.textContent='Continue remains usable'">Continue test mission menu</button>
<script src="/water-terrain.js"></script><script src="/chapter-maps.js"></script><script src="/mission-routes.js"></script><script src="/field-operations.js"></script><script src="/elite-catalog.js"></script><script src="/vehicle-art.js"></script><script src="/shared-battlefield-renderer.js"></script><script src="/wildlife-tranq.js"></script><script src="/showcase-scene.js"></script><script src="/commander-celebration.js"></script><script>
const appearance={soldier:'crimson_commander'};let run=0,options;
TigerStrikeBattlefieldRenderer.drawSoldierPortrait(document.getElementById('portrait').getContext('2d'),appearance);TigerStrikeBattlefieldRenderer.drawCommanderBanner(document.getElementById('banner').getContext('2d'),appearance);
window.TigerCombatFeel={settings:()=>({reducedFlashes:document.getElementById('reduced').checked})};
function show(coop){options={confirmed:true,animate:true,runKey:'isolated-'+(++run),players:[{eliteAppearance:appearance},...(coop?[{eliteAppearance:{soldier:'storm_medic'}}]:[])]};TigerCommanderCelebration.mount(document.getElementById('result'),options);}
function refresh(){if(options)TigerCommanderCelebration.mount(document.getElementById('result'),options);}
function failed(){TigerCommanderCelebration.mount(document.getElementById('result'),{...options,confirmed:false});}
</script></html>
