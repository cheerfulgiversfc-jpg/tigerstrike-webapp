<script>
window.Telegram={WebApp:{initData:'ISOLATED_TEST_ONLY'}};let offline=false,selection={},owned=['monsoon_uniform'];const realFetch=window.fetch;window.fetch=async(url,opts)=>{if(url!=='/api/events/rescue')return realFetch(url,opts);if(offline)throw Error('Simulated service unavailable');const b=JSON.parse(opts.body);if(b.action==='equip')selection[b.id==='monsoon_uniform'?'soldier':'weapon']=b.id;return {ok:true,json:async()=>({ok:true,phase:'active',event:TigerRescueEventConfig.EVENT,progress:{total:125,rescues:8,clears:2,earned:['monsoon_uniform']},owned,selection})};};
function open(){TigerRescueEventBoard.open({play:async mode=>{throw Error('Sample only: '+mode+' launch is intentionally disabled. Use the live game in Telegram.');}});}document.getElementById('open').onclick=()=>{offline=false;open();};document.getElementById('offline').onclick=()=>{offline=true;open();};
</script></html>
