<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monsoon Rescue — isolated sample event</title><link rel="stylesheet" href="/elite-armory.css"><style>body{font:16px system-ui;background:#081625;color:#e5f5ff;padding:24px}button{padding:16px;font:inherit}</style><h1>Monsoon Rescue — sample interface only</h1><p>Clearly simulated test counts and rewards. No Telegram requests, purchases, real mission or community progress.</p><button id="open">Open sample event board</button><button id="complete">Show completed event sample</button><button id="offline">Test unavailable event service</button><script src="/water-terrain.js"></script><script src="/chapter-maps.js"></script><script src="/tiger-encounters.js"></script><script src="/mission-routes.js"></script><script src="/field-operations.js"></script><script src="/elite-catalog.js"></script><script src="/vehicle-art.js"></script><script src="/shared-battlefield-renderer.js"></script><script src="/wildlife-tranq.js"></script><script src="/rescue-tools.js"></script><script src="/showcase-scene.js"></script><script src="/commander-celebration.js"></script><script src="/character-voice.js"></script><script src="/armory-organizer.js"></script><script src="/live-rescue-event.js"></script><script src="/rescue-event-board.js"></script></html>

<script>
window.Telegram={WebApp:{initData:'ISOLATED_TEST_ONLY'}};let offline=false,complete=false,selection={},owned=['monsoon_uniform'],schedule={paused:true,remainingMs:14*86400000,endsAt:0,startedAt:0,serverNow:Date.now(),phase:'paused'};const realFetch=window.fetch;window.fetch=async(url,opts)=>{if(url!=='/api/events/rescue')return realFetch(url,opts);if(offline)throw Error('Simulated service unavailable');const b=JSON.parse(opts.body);if(b.action==='resume'){schedule={...schedule,paused:false,phase:'active',endsAt:Date.now()+schedule.remainingMs,serverNow:Date.now()};}if(b.action==='pause')schedule={...schedule,paused:true,phase:'paused',remainingMs:schedule.endsAt-Date.now(),serverNow:Date.now()};if(b.action==='equip')selection[b.id==='monsoon_uniform'?'soldier':'weapon']=b.id;return {ok:true,json:async()=>({ok:true,phase:schedule.phase,schedule,canManage:true,event:TigerRescueEventConfig.EVENT,progress:{total:complete?1000:125,rescues:complete?30:8,clears:complete?10:2,earned:complete?['monsoon_uniform','monsoon_finish','monsoon_trophy']:['monsoon_uniform']},owned,selection,share:{url:'https://example.com',text:'SAMPLE ONLY: 8 rescues • Monsoon Ranger uniform'}})};};
function open(){TigerRescueEventBoard.open({play:async mode=>{throw Error('Sample only: '+mode+' launch is intentionally disabled. Use the live game in Telegram.');}});}document.getElementById('open').onclick=()=>{offline=false;open();};document.getElementById('complete').onclick=()=>{offline=false;complete=true;open();};document.getElementById('offline').onclick=()=>{offline=true;open();};
</script></html>
