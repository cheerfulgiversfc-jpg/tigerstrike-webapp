<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Armory Organizer — isolated interface test</title><link rel="stylesheet" href="/elite-armory.css"><style>body{background:#0b1525;color:#e6f2e6;font:16px/1.5 system-ui;padding:24px}button,select{padding:12px;min-height:44px;font:inherit;margin:6px}pre{white-space:pre-wrap}</style><h1>Armory Organizer — test fixtures only</h1><p>This isolated interface uses local test records, with no Telegram requests, purchases, real inventory or mission progress.</p><label>Active test mode <select id="mode"><option>Story</option><option>Arcade</option><option>Survival</option><option>Coop</option></select></label><button onclick="show(true)">Open test-owner loadouts</button><button onclick="show(false)">Open locked preview</button><pre id="resources"></pre>
<script src="/water-terrain.js"></script><script src="/chapter-maps.js"></script><script src="/mission-routes.js"></script><script src="/field-operations.js"></script><script src="/elite-catalog.js"></script><script src="/vehicle-art.js"></script><script src="/shared-battlefield-renderer.js"></script><script src="/rescue-tools.js"></script><script src="/wildlife-tranq.js"></script><script src="/showcase-scene.js"></script><script src="/armory-organizer.js"></script><script>
let data={owned:['organizer'],organizer:TigerArmoryOrganizer.book()},state;function context(){const mode=document.getElementById('mode').value;return {mode,allowed:true,survival:mode==='Survival',weapons:[{id:'W_AR_CARBINE',name:'AR Carbine',type:'lethal'}],tools:['med-drone','smoke','flare'],roles:['vanguard'],uniforms:['jungle'],current:{name:'Rescue Patrol',weaponId:'W_AR_CARBINE',ammoMode:mode==='Survival'?'real':'rubber',toolId:'med-drone',roleId:'vanguard',uniformId:'jungle',appearance:{}},currentAmmoMode:state?.ammoModeByWeapon.W_AR_CARBINE||'rubber',magAmmoMode:'rubber',magCap:()=>30,ammoFor:()=>50};}
function show(owned){data.owned=owned?['organizer']:[];state={mode:context().mode,equippedWeaponId:'W_AR_CARBINE',ammoModeByWeapon:{W_AR_CARBINE:'rubber'},ammoReserve:{RUBBER:45},mag:{loaded:5,ammoId:'RUBBER',weaponId:'W_AR_CARBINE',cap:30},hp:37,armor:20,missionSecondary:{id:'smoke',charges:0,uses:2}};report();TigerArmoryOrganizer.open({context,load:async()=>structuredClone(data),request:async(action,b)=>{if(!data.owned.includes('organizer'))throw Error('Organizer is locked.');const row=data.organizer[b.mode][b.slot];if(row.revision!==b.expectedRevision)throw Error('Refresh this slot.');data.organizer[b.mode][b.slot]={revision:row.revision+1,updatedAt:Date.now(),preset:action==='preset-delete'?null:TigerArmoryOrganizer.normalize(b.preset,b.mode)};return structuredClone(data);},apply:async(mode,i)=>{const p=data.organizer[mode][i].preset;TigerArmoryOrganizer.applySolo(state,p,context());report();}});}
function report(){document.getElementById('resources').textContent=JSON.stringify({hp:state.hp,armor:state.armor,reserve:state.ammoReserve,magazine:state.mag.loaded,fieldUses:state.missionSecondary.charges},null,2);}
</script></html>
