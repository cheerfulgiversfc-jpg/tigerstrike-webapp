<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rescue Command — isolated sample records</title><link rel="stylesheet" href="/rescue-command.css"><style>body{background:#0b202b;color:#eff7ff;font:16px system-ui;padding:20px}button{padding:14px;margin:8px;font:inherit}</style><h1>Rescue Command — sample records only</h1><p>Isolated artwork and interaction checks. No Telegram account, purchases or mission supplies are changed.</p><button id="empty">Open empty center</button><button id="full">Open developed center</button><button id="error">Test unavailable records</button>
<script src="/water-terrain.js"></script><script src="/chapter-maps.js"></script><script src="/tiger-encounters.js"></script><script src="/mission-routes.js"></script><script src="/field-operations.js"></script><script src="/vehicle-art.js"></script><script src="/shared-battlefield-renderer.js"></script><script src="/expedition-mastery.js"></script><script src="/rescue-expedition.js"></script><script src="/rescue-command.js"></script><script>
let book=TigerExpeditionMastery.empty();for(let i=0;i<6;i++)book=TigerExpeditionMastery.credit(book,{id:'sample-'+i,expeditionId:'river-gate',route:i%2?'bridge':'clinic',results:[1,2,3].map(stage=>({stage,mode:i%2?'Co-op':'Solo',team:[{userId:1}],survivors:stage===1?[]:['Sample evacuee A','Sample evacuee B'],captures:1}))},1);
document.getElementById('empty').onclick=()=>TigerRescueCommand.open({book:{}});
document.getElementById('full').onclick=()=>TigerRescueCommand.open({book,load:async()=>book});
document.getElementById('error').onclick=()=>TigerRescueCommand.open({book,load:async()=>{throw Error('Simulated connection unavailable');}});
</script></html>
