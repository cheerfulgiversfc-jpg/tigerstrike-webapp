<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiger Strike V17.5 artwork review</title><style>*{box-sizing:border-box}body{margin:0;background:#08151c;color:#e4ede6;font:16px system-ui}header{max-width:1200px;margin:auto;padding:22px}h1{font-size:26px;margin:0 0 8px}p{color:#a9c1bc}button{font:inherit;background:#234d4c;color:#eaf5e9;border:1px solid #83b7a2;padding:12px 20px;border-radius:9px}main{max-width:1200px;margin:auto;padding:0 14px 24px;display:grid;gap:18px}figure{margin:0;border:1px solid #52786e;border-radius:14px;overflow:hidden}canvas{display:block;width:100%;height:auto;background:#234139}figcaption{padding:14px;background:#132c31}</style><header><h1>V17.5 — Field Detail & Wildlife Anatomy</h1><p>Production artwork: the same models used in Solo, Co-op, HQ, equipment previews and rescue scenes. This review uses no player accounts or supplies.</p><button id="motion">Play animations</button></header><main><figure><canvas id="field" width="1200" height="700"></canvas><figcaption>Tactical fabric and plate-carrier detail, restrained facial proportions, natural tiger gait and matching civilians.</figcaption></figure><figure><canvas id="uniforms" width="1200" height="410"></canvas><figcaption>Earned and premium uniforms retain their own colors, gear and ownership. Preview artwork grants nothing.</figcaption></figure><figure><canvas id="wildlife" width="1200" height="450"></canvas><figcaption>Calm, warning, weakened and tranquilized states remain tied to actual tiger state.</figcaption></figure><figure><canvas id="fleet" width="1200" height="450"></canvas><figcaption>Shared conservation truck, helicopter and rescue boat receive matching material detail.</figcaption></figure></main><script src="/water-terrain.js"></script><script src="/chapter-maps.js"></script><script src="/tiger-encounters.js"></script><script src="/mission-routes.js"></script><script src="/field-operations.js"></script><script src="/elite-catalog.js"></script><script src="/vehicle-art.js"></script><script src="/shared-battlefield-renderer.js"></script><script>
const R=TigerStrikeBattlefieldRenderer;let animate=false,clock=1400;const contexts=Object.fromEntries(['field','uniforms','wildlife','fleet'].map(id=>[id,document.getElementById(id).getContext('2d')]));
function ground(c){c.clearRect(0,0,c.canvas.width,c.canvas.height);c.fillStyle='#315a3d';c.fillRect(0,0,c.canvas.width,c.canvas.height);R.drawGroundTexture(c,{x:0,y:0,w:c.canvas.width,h:c.canvas.height});R.drawMapLighting(c,{x:0,y:0,w:c.canvas.width,h:c.canvas.height});}
function caption(c,text,x,y){c.fillStyle='#e2efe1';c.font='600 19px system-ui';c.textAlign='center';c.fillText(text,x,y);}
function draw(now){for(const c of Object.values(contexts))ground(c);let c=contexts.field;R.drawMapHouse(c,40,100,270,145);R.drawMapTree(c,1060,160,2);R.drawMapTree(c,190,570,2);R.drawSoldier(c,{x:405,y:440,face:0,role:'support'},{scale:4,phase:now/250,blend:animate?1:0,showMarker:false});R.drawSoldier(c,{x:575,y:440,face:0,skin:'#815d47',eliteAppearance:{soldier:'midnight'}},{scale:4,phase:now/250+1,blend:animate?1:0,showMarker:false});R.drawTiger(c,{id:'reference-patrol',x:860,y:440,hp:100,hpMax:100},{scale:3.2,facing:-1,phase:now/230,walking:animate,showState:false,now});R.drawCivilian(c,{id:'worker',x:290,y:590,look:'driver',hair:1,skin:'#bc8e6c'},{scale:2.8,walking:animate,phase:now/250});R.drawCivilian(c,{id:'medic',x:645,y:600,look:'doctor',skin:'#8c674f',hair:2,vip:true},{scale:2.8,walking:animate,phase:now/250});caption(c,'Shared production field models',600,60);
c=contexts.uniforms;for(const [i,id]of ['','midnight','storm_medic','crimson_commander'].entries()){const x=150+i*300;R.drawSoldier(c,{x,y:260,face:0,eliteAppearance:{soldier:id}},{scale:4,showMarker:false});caption(c,['Field Ranger','Midnight Ranger','Storm Medic','Crimson Commander'][i],x,335);}
c=contexts.wildlife;for(const [i,state]of [{hp:100},{hp:100,awarenessState:'attacking',pounceWindupUntil:now+600},{hp:28,rubberSlowed:true},{hp:0,captured:true}].entries()){R.drawTiger(c,{id:'wildlife-'+i,x:170+i*285,y:230,hpMax:100,...state},{scale:2.4,phase:now/230,walking:animate&&i===0,now,showState:true});caption(c,['Alert','Attack warning','Rubber weakened','Tranquilized'][i],160+i*285,365);}
c=contexts.fleet;const channel={kind:'river',x:600,y:365,rx:700,ry:70,wavelength:2400,bridges:[],label:'Rescue channel'};R.drawMapWater(c,channel,{view:{x:0,y:0,w:1200,h:450},now});R.drawVehicle(c,{type:'transport',x:305,y:230},{scale:1.75,now,moving:animate});R.drawCaptureCage(c,160,176,.8,{now});R.drawCaptureCage(c,243,176,.8,{now});R.drawVehicle(c,{type:'helicopter',x:800,y:150},{scale:2.1,now});R.drawVehicle(c,{type:'boat',x:870,y:TigerWaterTerrain.banks(channel,870).center},{scale:1.75,now,moving:animate,wake:false});}
function loop(t){if(!animate)return;clock=t;draw(clock);requestAnimationFrame(loop);}document.getElementById('motion').onclick=()=>{animate=!animate;document.getElementById('motion').textContent=animate?'Pause animations':'Play animations';if(animate)requestAnimationFrame(loop);else draw(clock);};draw(clock);
</script></html>
