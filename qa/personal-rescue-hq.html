<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Rescue HQ — isolated sample records</title><link rel="stylesheet" href="/elite-armory.css"><style>body{font:16px system-ui;background:#081625;color:#e5f5ff;padding:24px}button{padding:16px;font:inherit}</style><h1>Personal Rescue HQ — sample records only</h1><p>Isolated demonstration. No Telegram, purchases, real trophies or mission progress are changed.</p><button id="open">Open sample HQ</button><button id="standard">Open standard vehicle HQ</button><button id="empty">Open empty HQ</button><button id="error">Test unavailable Co-op records</button><script src="/water-terrain.js"></script><script src="/chapter-maps.js"></script><script src="/tiger-encounters.js"></script><script src="/mission-routes.js"></script><script src="/field-operations.js"></script><script src="/elite-catalog.js"></script><script src="/vehicle-art.js"></script><script src="/shared-battlefield-renderer.js"></script><script src="/wildlife-tranq.js"></script><script src="/rescue-tools.js"></script><script src="/showcase-scene.js"></script><script src="/commander-celebration.js"></script><script src="/character-voice.js"></script><script src="/armory-organizer.js"></script><script src="/elite-armory.js"></script><script src="/chapter-milestones.js"></script><script src="/mission-debrief.js"></script><script src="/personal-rescue-hq.js"></script></html>

<script>
let sample={};for(let i=1;i<=10;i++)sample=TigerMissionDebrief.record(sample,{id:'demo'+i,scope:'solo',missionKey:'Story:CAMPAIGN:'+i+':demo',mode:'Story',campaignLevel:i,title:'Sample Mission '+i,completed:true,durationMs:90000+i*1000,civilianTotal:3,rescued:3,bossCaptures:i===10?1:0}).state;
sample=TigerMissionDebrief.record(sample,{id:'demo-coop',scope:'coop',missionKey:'shared-story:1:demo',mode:'Story',campaignLevel:1,title:'Sample Co-op Mission 1',completed:true,durationMs:145000,civilianTotal:4,rescued:4}).state;
const gear={name:'Sample equipped soldier',weaponId:'W_AR_CARBINE',ammoMode:'rubber',toolId:'med-drone',appearance:{soldier:'crimson_commander',weapon:'guardian',equipment:'rescue_equipment',extraction:'extraction'}};
function show(empty=false,error=false,standard=false){TigerPersonalRescueHQ.open({load:async scope=>{if(error&&scope==='coop')throw Error('Simulated connection unavailable');return {records:empty?{}:sample,gear:standard?{...gear,appearance:{}}:gear,members:scope==='coop'?[{name:'Sample Commander',self:true,online:true,role:'tracker',weaponName:'Field Carbine',ammoMode:'rubber',toolId:'med-drone',eliteAppearance:gear.appearance},{name:'Sample Ranger',self:false,online:true,role:'medic',weaponName:'Ranger Rifle',ammoMode:'real',toolId:'smoke',eliteAppearance:{soldier:'midnight'}}]:[],mode:scope==='coop'?'Coop':'Story',weaponName:'AR Carbine',equipmentLabel:'Sample setup — not an account entitlement'};}});}
document.getElementById('standard').onclick=()=>show(false,false,true);
document.getElementById('open').onclick=()=>show();document.getElementById('empty').onclick=()=>show(true);document.getElementById('error').onclick=()=>show(false,true);
</script></html>
