<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiger Strike production artwork review</title><style>body{background:#091b25;color:#e2eee5;font:16px system-ui;margin:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:24px}figure{margin:0;border:1px solid #4e7b7e;border-radius:14px;overflow:hidden;background:#142a35}canvas{width:100%;height:auto;display:block}figcaption{padding:12px}button{padding:12px;background:#295462;color:#ecf8f1;border:1px solid #83b4b1;border-radius:8px;font:inherit}</style><h1>Tiger Strike — shared production artwork</h1><p>The same models and scenery render in the shop, Solo, Co-op and cinematics. This isolated review does not load accounts, invoices or mission state.</p><button id="animate">Play animations</button><main><figure><canvas id="soldier" width="1200" height="720"></canvas><figcaption>Midnight Ranger and the production tiger in the Chapter 1 environment.</figcaption></figure><figure><canvas id="helicopter" width="1200" height="720"></canvas><figcaption>Detailed helicopter with animated rotor, cabin crew, panel seams and rescue livery.</figcaption></figure><figure><canvas id="boat" width="1200" height="720"></canvas><figcaption>Rescue boat on the actual chapter river, with animated water and wake.</figcaption></figure><figure><canvas id="truck" width="1200" height="720"></canvas><figcaption>Rescue truck follows the production road, with reflective glass, tires and equipment.</figcaption></figure><figure><canvas id="transfer" width="1200" height="375"></canvas><figcaption>Wildlife transport uses the same detailed truck, live tiger artwork and secured cages.</figcaption></figure><figure><canvas id="intro" width="1200" height="650"></canvas><figcaption>Mission intro uses production soldiers, civilians, tigers, houses, trees and helicopter.</figcaption></figure></main><script src="/water-terrain.js"></script><script src="/chapter-maps.js"></script><script src="/tiger-encounters.js"></script><script src="/mission-routes.js"></script><script src="/field-operations.js"></script><script src="/elite-catalog.js"></script><script src="/vehicle-art.js"></script><script src="/shared-battlefield-renderer.js"></script><script src="/showcase-scene.js"></script><script src="/story-cinematics.js"></script><script>let play=false,start=0;function paint(now=2400){TigerShowcaseScene.draw(document.getElementById('soldier').getContext('2d'),{current:'midnight',now,openedAt:0});for(const vehicle of ['helicopter','boat','truck'])TigerShowcaseScene.draw(document.getElementById(vehicle).getContext('2d'),{current:'extraction',vehicle,now:now%6000,openedAt:0});TigerShowcaseScene.drawTransfer(document.getElementById('transfer').getContext('2d'),{progress:.58,count:4,now});TigerStoryCinema.drawScene(document.getElementById('intro').getContext('2d'),17700);if(play)requestAnimationFrame(t=>paint(t-start+2400));}document.getElementById('animate').onclick=()=>{play=!play;document.getElementById('animate').textContent=play?'Pause animations':'Play animations';if(play){start=performance.now();requestAnimationFrame(t=>paint(t-start+2400));}};paint();</script></html>
